name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sop-guard/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: sop-guard/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          LLM_PROVIDER: mock
          WHISPER_MODE: mock

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sop-guard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sop-guard/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: sop-guard/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sop-guard/frontend/package-lock.json
      - name: Install backend deps
        working-directory: sop-guard/backend
        run: pip install -r requirements.txt
      - name: Install frontend deps
        working-directory: sop-guard/frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: sop-guard/frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright suite
        working-directory: sop-guard/frontend
        run: npx playwright test
        env:
          CI: true
          LLM_PROVIDER: mock
          WHISPER_MODE: mock
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: sop-guard/frontend/playwright-report/
          retention-days: 7
