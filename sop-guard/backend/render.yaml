# Render deployment blueprint for the SOP-Guard backend.
# Research prototype  - NOT for clinical use.
#
# Deploy: push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" and point it at this file.

services:
  - type: web
    name: sop-guard-backend
    runtime: python
    plan: free
    rootDir: sop-guard/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # SQLite lives on the container's ephemeral disk. For durable storage,
      # attach a Render disk mounted at /app/data and point DATABASE_URL at it,
      # or use a managed Postgres URL (postgresql+asyncpg://...).
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./sop_guard.db
      # In-house model only: no third-party LLM API is ever called. LLM_BASE_URL
      # must point at an Ollama instance the hospital controls (e.g. a private
      # network endpoint); if unset/unreachable, the pipeline runs in mock mode.
      - key: LLM_PROVIDER
        value: ollama
      - key: LLM_MODEL
        value: llama3.2
      - key: LLM_BASE_URL
        sync: false
      # Comma-separated origins are also accepted by pydantic-settings.
      - key: CORS_ORIGINS
        value: '["https://your-frontend.example.com"]'
